services:
  caddy:
    image: caddy:2.10-alpine
    ports: ['80:80','443:443']
    environment:
      TASK6_DOMAIN: ${TASK6_DOMAIN:?domain required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
