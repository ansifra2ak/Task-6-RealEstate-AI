name: task6phase9
services:
  app:
    image: ${TASK6_PHASE9_IMAGE:-task6-phase9:local}
    build:
      context: ${TASK6_PHASE9_ROOT:?launcher required}/.phase9-build
      dockerfile: Dockerfile
    entrypoint: ["python", "-m", "backend.phase9_supervisor"]
    environment:
      TASK6_PUBLIC_ORIGIN: ${TASK6_PUBLIC_ORIGIN:-}
    ports: ["127.0.0.1:5176:5176", "127.0.0.1:8006:8006"]
    volumes:
      - ${TASK6_PHASE9_ROOT}/.phase9-private/data:/app/data:ro
      - ${TASK6_PHASE9_ROOT}/.phase9-private/reports:/app/reports:ro
      - ${TASK6_PHASE9_ROOT}/.phase9-private/visualizations:/app/visualizations:ro
      - ${TASK6_PHASE9_ROOT}/.phase9-private/champion:/app/champion:ro
    secrets: [api_key, viewer_password]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8006/api/v1/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.5.0
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../monitoring/phase7/alerts.yml:/etc/prometheus/alerts.yml:ro
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=1d"]
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.1.0
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
    secrets: [grafana_password]
    volumes:
      - ../../monitoring/phase7/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../monitoring/phase7/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    restart: unless-stopped
secrets:
  api_key:
    file: ${TASK6_PHASE9_ROOT}/.phase9-secrets/api_key
  viewer_password:
    file: ${TASK6_PHASE9_ROOT}/.phase9-secrets/viewer_password
  grafana_password:
    file: ${TASK6_PHASE9_ROOT}/.phase9-secrets/grafana_password
