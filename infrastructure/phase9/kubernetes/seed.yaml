apiVersion: v1
kind: Pod
metadata:
  name: task6-seed
  namespace: task6
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: seed
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - {name: private, mountPath: /private}
  volumes:
    - name: private
      persistentVolumeClaim:
        claimName: task6-private
